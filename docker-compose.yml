services:
  db:
    image: mysql:8.4
    container_name: todo-ninja-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todo_ninja
      MYSQL_USER: todo_ninja
      MYSQL_PASSWORD: todo_ninja
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-ninja-backend
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    ports:
      - "8100:8100"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8100
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: todo_ninja
      DB_USERNAME: todo_ninja
      DB_PASSWORD: todo_ninja
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -lc "
        if [ ! -f .env ]; then cp .env.example .env; fi &&
        composer install --no-interaction --prefer-dist &&
        php artisan key:generate --force &&
        until php -r '\''$$h=getenv("DB_HOST");$$p=getenv("DB_PORT");$$u=getenv("DB_USERNAME");$$pw=getenv("DB_PASSWORD");try{new PDO("mysql:host=$$h;port=$$p",$$u,$$pw);exit(0);}catch(Exception $$e){exit(1);} '\''; do
          echo Waiting for database...;
          sleep 2;
        done &&
        php artisan migrate --force &&
        php artisan serve --host=0.0.0.0 --port=8100
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-ninja-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3100:3100"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8100/api
    depends_on:
      - backend
    command: >
      sh -lc "
        npm install &&
        npm run dev -- --port 3100 --hostname 0.0.0.0
      "

volumes:
  db_data:
  backend_vendor:
  frontend_node_modules:
